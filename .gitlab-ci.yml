stages:
  - build
  - deploy

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

.build_template: &build_template
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG ./backend/$SERVICE_NAME
    - docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG

build-auth-service:
  <<: *build_template
  variables:
    SERVICE_NAME: auth-service

build-user-service:
  <<: *build_template
  variables:
    SERVICE_NAME: user-service

build-business-service:
  <<: *build_template
  variables:
    SERVICE_NAME: business-service

build-discovery-service:
  <<: *build_template
  variables:
    SERVICE_NAME: discovery-service

build-api-gateway:
  <<: *build_template
  variables:
    SERVICE_NAME: api-gateway

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl apply -k k8s/
  only:
    - main