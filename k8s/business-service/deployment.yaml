apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: business-service
  template:
    metadata:
      labels:
        app: business-service
    spec:

      containers:
        - name: business-service
          image: sayubb/app-angular-springing-business-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8083

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: SERVER_PORT
              value: "8083"

            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: postgres

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET

            - name: CORS_ALLOWED_ORIGINS
              value: "http://app.local,http://localhost"

            - name: STARTUP_DB_WAIT_ENABLED
              value: "true"

            - name: STARTUP_DB_WAIT_TIMEOUT_SECONDS
              value: "60"

         