apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      
      containers:
        - name: api-gateway
          image: sayubb/app-angular-springing-api-gateway:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 9090

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          env:
            - name: SERVER_PORT
              value: "9090"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET

            - name: CORS_ALLOWED_ORIGINS
              value: "http://app.local,http://localhost"

            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"

            - name: USER_SERVICE_URL
              value: "http://user-service:8082"

            - name: BUSINESS_SERVICE_URL
              value: "http://business-service:8083"

         