apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
     
      containers:
        - name: user-service
          image: sayubb/app-angular-springing-user-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8082

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          env:
            - name: SERVER_PORT
              value: "8082"

            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: postgres

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET

            - name: CORS_ALLOWED_ORIGINS
              value: "http://app.local,http://localhost"

            - name: STARTUP_DB_WAIT_ENABLED
              value: "true"

            - name: STARTUP_DB_WAIT_TIMEOUT_SECONDS
              value: "60"

        