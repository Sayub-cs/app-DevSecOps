apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: app
  labels:
    app: sonarqube

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sonarqube

  template:
    metadata:
      labels:
        app: sonarqube

    spec:
      nodeSelector:
        kubernetes.io/hostname: mouha-vmware-virtual-desktop

      securityContext:
        fsGroup: 1000

      containers:
        - name: sonarqube
          image: sonarqube:lts-community
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 9000
              name: http

          env:
            - name: SONAR_JDBC_URL
              value: jdbc:postgresql://postgres:5432/sonarqube

            - name: SONAR_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sonarqube-secret
                  key: SONAR_JDBC_USERNAME

            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-secret
                  key: SONAR_JDBC_PASSWORD

            - name: SONAR_WEB_JAVAOPTS
              value: "-Xms256m -Xmx512m"

            - name: SONAR_CE_JAVAOPTS
              value: "-Xms256m -Xmx512m"

            - name: SONAR_SEARCH_JAVAOPTS
              value: "-Xms512m -Xmx512m"

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"

          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data

            - name: sonarqube-extensions
              mountPath: /opt/sonarqube/extensions

            - name: sonarqube-logs
              mountPath: /opt/sonarqube/logs

          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 20

      volumes:
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: sonarqube-data

        - name: sonarqube-extensions
          persistentVolumeClaim:
            claimName: sonarqube-extensions

        - name: sonarqube-logs
          persistentVolumeClaim:
            claimName: sonarqube-logs